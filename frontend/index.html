<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Status · 4H</title>
  <style>
    :root { --bg:#0b0f14; --card:#141a22; --border:#243041; --text:#e8eef6; --muted:#8b9bb0; --long:#22c55e; --short:#ef4444; --none:#64748b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }
    header { margin-bottom:22px; }
    h1 { font-size:1.45rem; font-weight:600; }
    .updated { color:var(--muted); font-size:0.82rem; margin-top:4px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; cursor:pointer; transition:border-color .15s,transform .15s; }
    .card:hover { border-color:#3d4f66; transform:translateY(-1px); }
    .card.has-signal { border-color:rgba(34,197,94,.35); }
    .card.has-signal.short { border-color:rgba(239,68,68,.35); }
    .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .sym { font-size:1.2rem; font-weight:700; }
    .name { color:var(--muted); font-size:0.78rem; margin-top:2px; }
    .badge { font-size:0.72rem; font-weight:800; padding:5px 11px; border-radius:999px; letter-spacing:.04em; display:inline-block; }
    .badge.LONG { background:rgba(34,197,94,.18); color:var(--long); }
    .badge.SHORT { background:rgba(239,68,68,.18); color:var(--short); }
    .badge.BRAK, .badge.NIC { background:rgba(100,116,139,.2); color:var(--none); }
    .price-row { margin-bottom:8px; font-size:0.9rem; }
    .price-row span { color:var(--muted); }
    .entry-box { background:rgba(0,0,0,.28); border-radius:10px; padding:10px 12px; margin-bottom:10px; font-size:0.88rem; }
    .entry-box .lbl { color:var(--muted); font-size:0.72rem; text-transform:uppercase; }
    .entry-box .val { font-weight:700; font-size:1.05rem; margin-top:2px; }
    .reasons { font-size:0.8rem; color:var(--muted); line-height:1.45; }
    .reasons li { margin-left:14px; margin-top:3px; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:100; align-items:center; justify-content:center; padding:16px; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--card); border:1px solid var(--border); border-radius:16px; max-width:640px; width:100%; max-height:92vh; overflow-y:auto; padding:24px; }
    .modal-header { display:flex; justify-content:space-between; margin-bottom:18px; }
    .modal-header h2 { font-size:1.3rem; }
    .close-btn { background:none; border:none; color:var(--muted); font-size:1.6rem; cursor:pointer; }
    .decision-hero { text-align:center; padding:16px; border-radius:12px; margin-bottom:16px; background:rgba(0,0,0,.3); }
    .decision-hero .big { font-size:1.8rem; font-weight:800; letter-spacing:.06em; }
    .decision-hero.LONG .big { color:var(--long); }
    .decision-hero.SHORT .big { color:var(--short); }
    .decision-hero.BRAK .big { color:var(--none); }
    .metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
    .metric { background:rgba(0,0,0,.25); border-radius:10px; padding:10px; text-align:center; }
    .metric .lbl { font-size:0.7rem; color:var(--muted); text-transform:uppercase; }
    .metric .val { font-weight:700; margin-top:4px; font-size:0.95rem; }
    .section { margin-top:14px; }
    .section-title { font-size:0.72rem; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
    .tag { display:inline-block; background:rgba(255,255,255,.06); border-radius:6px; padding:3px 8px; font-size:0.8rem; margin:2px 4px 2px 0; }
    .tag.bull { color:var(--long); } .tag.bear { color:var(--short); }
    .empty { color:var(--muted); font-size:0.85rem; }
    .ctx { margin-top:18px; padding-top:14px; border-top:1px solid var(--border); font-size:0.82rem; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Market Status · decyzje 4H</h1>
    <div class="updated" id="updated">Ladowanie...</div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="m-title">—</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div id="m-body"></div>
    </div>
  </div>
  <script>
    let DATA = [];

    function biasClass(b) {
      if (b === 'LONG' || b === 'SHORT') return b;
      return 'NIC';
    }

    function fmt(n) {
      if (n == null || n === '') return '—';
      const x = Number(n);
      if (isNaN(x)) return '—';
      if (Math.abs(x) >= 100) return x.toFixed(2);
      if (Math.abs(x) >= 1) return x.toFixed(4);
      return x.toFixed(5);
    }

    async function load() {
      try {
        const res = await fetch('../output/decisions_log.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const decisions = json.decisions || json;

        const latest = new Map();
        decisions.forEach(d => {
          const sym = d.symbol;
          const cur = latest.get(sym);
          const dT = d.candle_close_time || d.timestamp || '';
          const cT = cur ? (cur.candle_close_time || cur.timestamp || '') : '';
          if (!cur || dT > cT) latest.set(sym, d);
        });

        DATA = Array.from(latest.values()).map(d => ({
          symbol: d.symbol,
          name: d.symbol,
          updated: d.timestamp,
          _raw: d
        }));

        render();
        if (DATA.length) {
          const newest = Math.max(...DATA.map(x => new Date(x.updated).getTime()));
          document.getElementById('updated').textContent = 'Dane z: ' + new Date(newest).toLocaleString('pl-PL');
        } else {
          document.getElementById('updated').textContent = 'Brak decyzji w logu';
        }
      } catch(e) {
        document.getElementById('updated').textContent = 'Błąd ładowania: ' + e.message;
        console.error(e);
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      DATA.forEach((item, idx) => {
        const raw = item._raw || {};
        const bias = raw.decision || 'NIC';
        const conf = raw.confidence != null ? raw.confidence : 0;
        const entry = raw.entry;
        const stop = raw.stop;
        const target = raw.target;
        const candle = raw.candle_close_time || raw.timestamp || '';
        const f = raw.filars || {};
        const stale = raw.candle_stale ? '⏳' : '';

        const card = document.createElement('div');
        card.className = 'card' + ((bias === 'LONG' || bias === 'SHORT') ? (' has-signal' + (bias === 'SHORT' ? ' short' : '')) : '');
        card.onclick = () => openModal(idx);

        const candleShort = candle ? new Date(candle).toLocaleString('pl-PL', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
        const hasSignal = (bias === 'LONG' || bias === 'SHORT');

        card.innerHTML = `
          <div class="top">
            <div>
              <div class="sym">${item.symbol.toUpperCase()}</div>
              <div class="name">${item.name || ''}</div>
            </div>
            <span class="badge ${biasClass(bias)}">${bias}</span>
          </div>
          <div class="price-row"><span>Pewność:</span> <b>${conf}%</b> ${stale}</div>
          <div class="price-row"><span>Świeca 4H:</span> ${candleShort}</div>
          <div class="price-row"><span>Filar:</span> Renko ${f.renko?'✅':'⚪'} · Harm ${f.harmonic?'✅':'⚪'} · Świeca ${f.candle?'✅':'⚪'}</div>
          <div class="entry-box">
            <div class="lbl">Wejście</div>
            <div class="val">${hasSignal ? fmt(entry) : '—'}</div>
            <div class="price-row" style="margin-top:6px;margin-bottom:0">
              <span>Stop:</span> ${hasSignal ? fmt(stop) : '—'} · <span>Cel:</span> ${hasSignal ? fmt(target) : '—'}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(idx) {
      const item = DATA[idx];
      const raw = item._raw || {};
      const bias = raw.decision || 'NIC';
      const conf = raw.confidence != null ? raw.confidence : 0;
      const entry = raw.entry;
      const stop = raw.stop;
      const target = raw.target;
      const rr = raw.rr != null ? ('1:' + raw.rr) : '—';
      const candle = raw.candle_close_time || raw.timestamp || '';
      const daily = raw.daily_context || '—';
      const reasons = raw.reasons || [];
      const f = raw.filars || {};
      const confluence = raw.confluence || '—';
      const atr = raw.atr_4h != null ? fmt(raw.atr_4h) : '—';
      const stale = raw.candle_stale ? ' (⏳ dane mogą być nieaktualne)' : '';

      document.getElementById('m-title').textContent = item.symbol.toUpperCase();

      let html = `
        <div class="decision-hero ${biasClass(bias)}">
          <div class="big">${bias}</div>
          <div style="color:#8b9bb0;margin-top:4px">pewność ${conf}% · confluence ${confluence}</div>
        </div>

        <div class="metrics">
          <div class="metric"><div class="lbl">Wejście</div><div class="val">${fmt(entry)}</div></div>
          <div class="metric"><div class="lbl">Stop</div><div class="val">${fmt(stop)}</div></div>
          <div class="metric"><div class="lbl">Cel</div><div class="val">${fmt(target)}</div></div>
        </div>

        <div class="metrics">
          <div class="metric"><div class="lbl">R:R</div><div class="val">${rr}</div></div>
          <div class="metric"><div class="lbl">ATR(14)</div><div class="val">${atr}</div></div>
          <div class="metric"><div class="lbl">Kontekst Daily</div><div class="val">${daily}</div></div>
        </div>

        <div class="section">
          <div class="section-title">Filar confluence</div>
          <span class="tag ${f.renko?'bull':''}">Renko ${f.renko?'✅':'⚪'}</span>
          <span class="tag ${f.harmonic?'bull':''}">Harmoniczna ${f.harmonic?'✅':'⚪'}</span>
          <span class="tag ${f.candle?'bull':''}">Świeca ${f.candle?'✅':'⚪'}</span>
        </div>

        <div class="section">
          <div class="section-title">Dlaczego</div>
          ${reasons.length
            ? '<ul class="reasons">' + reasons.map(r => '<li>' + r + '</li>').join('') + '</ul>'
            : '<div class="empty">Brak wyraźnych powodów</div>'}
        </div>

        <div class="ctx">
          Świeca 4H zamknięta: ${candle ? new Date(candle).toLocaleString('pl-PL') : '—'}${stale}
        </div>
      `;

      document.getElementById('m-body').innerHTML = html;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    load();
  </script>
</body>
</html>
