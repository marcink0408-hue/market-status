<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Status · 4H</title>
  <style>
    :root { --bg:#0b0f14; --card:#141a22; --border:#243041; --text:#e8eef6; --muted:#8b9bb0; --long:#22c55e; --short:#ef4444; --none:#64748b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }
    header { margin-bottom:22px; }
    h1 { font-size:1.45rem; font-weight:600; }
    .updated { color:var(--muted); font-size:0.82rem; margin-top:4px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; cursor:pointer; transition:border-color .15s,transform .15s; }
    .card:hover { border-color:#3d4f66; transform:translateY(-1px); }
    .card.has-signal { border-color:rgba(34,197,94,.35); }
    .card.has-signal.short { border-color:rgba(239,68,68,.35); }
    .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .sym { font-size:1.2rem; font-weight:700; }
    .name { color:var(--muted); font-size:0.78rem; margin-top:2px; }
    .badge { font-size:0.72rem; font-weight:800; padding:5px 11px; border-radius:999px; letter-spacing:.04em; display:inline-block; }
    .badge.LONG { background:rgba(34,197,94,.18); color:var(--long); }
    .badge.SHORT { background:rgba(239,68,68,.18); color:var(--short); }
    .badge.BRAK, .badge.NIC { background:rgba(100,116,139,.2); color:var(--none); }
    .price-row { margin-bottom:8px; font-size:0.9rem; }
    .price-row span { color:var(--muted); }
    .entry-box { background:rgba(0,0,0,.28); border-radius:10px; padding:10px 12px; margin-bottom:10px; font-size:0.88rem; }
    .entry-box .lbl { color:var(--muted); font-size:0.72rem; text-transform:uppercase; }
    .entry-box .val { font-weight:700; font-size:1.05rem; margin-top:2px; }
    .reasons { font-size:0.8rem; color:var(--muted); line-height:1.45; }
    .reasons li { margin-left:14px; margin-top:3px; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:100; align-items:center; justify-content:center; padding:16px; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--card); border:1px solid var(--border); border-radius:16px; max-width:1100px; width:100%; max-height:94vh; overflow-y:auto; padding:24px; }
    #price-chart { width:100%; height:440px; min-height:320px; background:#0b0f14; border:1px solid var(--border); border-radius:10px; }
    .chart-note { color:var(--muted); font-size:.76rem; margin-top:6px; }
    @media(max-width:650px) { body{padding:12px} .modal{padding:14px} #price-chart{height:340px} .metrics{grid-template-columns:1fr 1fr} }
    .modal-header { display:flex; justify-content:space-between; margin-bottom:18px; }
    .modal-header h2 { font-size:1.3rem; }
    .close-btn { background:none; border:none; color:var(--muted); font-size:1.6rem; cursor:pointer; }
    .decision-hero { text-align:center; padding:16px; border-radius:12px; margin-bottom:16px; background:rgba(0,0,0,.3); }
    .decision-hero .big { font-size:1.8rem; font-weight:800; letter-spacing:.06em; }
    .decision-hero.LONG .big { color:var(--long); }
    .decision-hero.SHORT .big { color:var(--short); }
    .decision-hero.BRAK .big { color:var(--none); }
    .metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
    .metric { background:rgba(0,0,0,.25); border-radius:10px; padding:10px; text-align:center; }
    .metric .lbl { font-size:0.7rem; color:var(--muted); text-transform:uppercase; }
    .metric .val { font-weight:700; margin-top:4px; font-size:0.95rem; }
    .section { margin-top:14px; }
    .section-title { font-size:0.72rem; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
    .tag { display:inline-block; background:rgba(255,255,255,.06); border-radius:6px; padding:3px 8px; font-size:0.8rem; margin:2px 4px 2px 0; }
    .tag.bull { color:var(--long); } .tag.bear { color:var(--short); }
    .empty { color:var(--muted); font-size:0.85rem; }
    .ctx { margin-top:18px; padding-top:14px; border-top:1px solid var(--border); font-size:0.82rem; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Market Status · decyzje 4H</h1>
    <div class="updated" id="updated">Ladowanie...</div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="m-title">—</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div id="m-body"></div>
    </div>
  </div>
  <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    let DATA = [];
    let CHART_DATA = null;
    let activeChart = null;
    let chartResizeObserver = null;

    async function loadChartData() {
      try {
        const r = await fetch('../output/ohlc.json?t=' + Date.now(), {cache:'no-store'});
        if (!r.ok) throw new Error('HTTP ' + r.status);
        CHART_DATA = await r.json();
      } catch (e) { console.warn('Brak danych wykresu:', e); CHART_DATA = null; }
    }

    function renderPriceChart(symbol, item) {
      const host = document.getElementById('price-chart');
      if (!host) return;
      if (activeChart) { activeChart.remove(); activeChart = null; }
      if (chartResizeObserver) { chartResizeObserver.disconnect(); chartResizeObserver = null; }
      host.innerHTML = '';
      const payload = CHART_DATA && CHART_DATA.symbols && CHART_DATA.symbols[symbol];
      if (!payload || !payload.candles || !payload.candles.length || !window.LightweightCharts) {
        host.innerHTML = '<div style="padding:18px;color:#8b9bb0">Brak danych wykresu. Sprawdź output/ohlc.json.</div>';
        return;
      }
      activeChart = LightweightCharts.createChart(host, {
        width:host.clientWidth,height:host.clientHeight,
        layout:{background:{type:'solid',color:'#0b0f14'},textColor:'#cbd5e1'},
        grid:{vertLines:{color:'#1e293b'},horzLines:{color:'#1e293b'}},
        rightPriceScale:{borderColor:'#334155'},
        timeScale:{borderColor:'#334155',timeVisible:true,secondsVisible:false},
        crosshair:{mode:LightweightCharts.CrosshairMode.Normal}
      });
      const series = activeChart.addCandlestickSeries({
        upColor:'#22c55e',downColor:'#ef4444',borderUpColor:'#22c55e',
        borderDownColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444'
      });
      series.setData(payload.candles);

const allMarkers = [...(payload.markers || [])];

(payload.harmonics || []).forEach((pattern, index) => {
    const points = pattern.points || [];
    if (points.length < 4) return;

    const color = pattern.direction === 'bullish'
        ? '#22c55e'
        : '#ef4444';

    const line = activeChart.addLineSeries({
        color: color,
        lineWidth: 2,
        lineStyle: pattern.status === 'completed'
            ? LightweightCharts.LineStyle.Solid
            : LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false
    });

    line.setData(
        points.map(p => ({
            time: p.time,
            value: p.value
        }))
    );

    points.forEach(point => {
        allMarkers.push({
            time: point.time,
            position: pattern.direction === 'bullish'
                ? 'belowBar'
                : 'aboveBar',
            color: color,
            shape: 'circle',
            text: pattern.name + ' ' + point.label
        });
    });
});

if (allMarkers.length) {
    allMarkers.sort((a, b) => a.time - b.time);
    series.setMarkers(allMarkers);
}
      [['entry','ENTRY','#3b82f6'],['stop','STOP LOSS','#ef4444'],['target','TAKE PROFIT','#22c55e']].forEach(([key,title,color]) => {
        const v = item[key] != null ? item[key] : (payload.levels || {})[key];
        if (v != null && Number.isFinite(Number(v))) series.createPriceLine({
          price:Number(v),color,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,
          axisLabelVisible:true,title
        });
      });
      activeChart.timeScale().fitContent();
      chartResizeObserver = new ResizeObserver(entries => {
        if (activeChart && entries.length) activeChart.applyOptions({width:entries[0].contentRect.width});
      });
      chartResizeObserver.observe(host);
    }

    function biasClass(b) {
      if (b === 'LONG' || b === 'SHORT') return b;
      return 'NIC';
    }

    function decClass(d) {
      return (d === 'LONG' || d === 'SHORT') ? d : 'BRAK';
    }

    function fmt(n) {
      if (n == null || n === '') return '—';
      const x = Number(n);
      if (isNaN(x)) return '—';
      if (Math.abs(x) >= 100) return x.toFixed(2);
      if (Math.abs(x) >= 1) return x.toFixed(4);
      return x.toFixed(5);
    }

    function modulesHtml(raw) {
      const f = raw.filars || {};
      const icon = ok => ok ? '✅' : '⚪';
      const pillars = raw.confluence ? raw.confluence : '—';
      return '<div class="price-row" style="margin-bottom:8px">Renko ' + icon(f.renko) + ' · Harm ' + icon(f.harmonic) + ' · Swieca ' + icon(f.candle) + ' · ' + pillars + '</div>';
    }

    function freshnessHtml(raw) {
      const t = raw.candle_close_time || raw.timestamp;
      if (!t) return '';
      let label = 'Swieca 4H: ' + new Date(t).toLocaleString('pl-PL');
      try {
        const ageH = (Date.now() - new Date(t).getTime()) / 3600000;
        if (ageH > 8) label = '⚠️ STARE DANE · ' + label;
        else if (ageH > 5) label = '⏳ ' + label;
      } catch(e) {}
      return '<div class="price-row" style="font-size:0.72rem;margin-bottom:6px">' + label + '</div>';
    }

    async function load() {
      try {
        const res = await fetch('../output/decisions_log.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const decisions = json.decisions || json;

        const latest = new Map();
        decisions.forEach(d => {
          const sym = d.symbol;
          const cur = latest.get(sym);
          const dT = d.candle_close_time || d.timestamp || '';
          const cT = cur ? (cur.candle_close_time || cur.timestamp || '') : '';
          if (!cur || dT > cT) latest.set(sym, d);
        });

        DATA = Array.from(latest.values());
        render();
        if (DATA.length) {
          const newest = Math.max(...DATA.map(x => new Date(x.timestamp).getTime()));
          document.getElementById('updated').textContent = 'Dane z: ' + new Date(newest).toLocaleString('pl-PL') + ' · TF: 4H';
        } else {
          document.getElementById('updated').textContent = 'Brak decyzji w logu';
        }
      } catch(e) {
        document.getElementById('updated').textContent = 'Błąd ładowania: ' + e.message;
        console.error(e);
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      let latest = '';
      const sorted = [...DATA].sort((a, b) => {
        const rank = d => (d.decision === 'LONG' || d.decision === 'SHORT') ? 0 : 1;
        return rank(a) - rank(b) || (b.confidence || 0) - (a.confidence || 0);
      });
      sorted.forEach(item => {
        const realIdx = DATA.indexOf(item);
        if (item.timestamp) latest = item.timestamp;
        const d = item.decision || 'BRAK';
        const card = document.createElement('div');
        card.className = 'card' + (d === 'LONG' ? ' has-signal' : d === 'SHORT' ? ' has-signal short' : '');
        card.onclick = () => openModal(realIdx);

        let entryHtml = '';
        if (d === 'LONG' || d === 'SHORT') {
          entryHtml = '<div class="entry-box"><div class="lbl">Wejscie</div><div class="val">' + fmt(item.entry) +
            '</div><div style="margin-top:6px;font-size:0.8rem;color:var(--muted)">Stop: ' + fmt(item.stop) +
            (item.target ? ' · Cel: ' + fmt(item.target) : '') + (item.rr ? ' · R:R 1:' + item.rr : '') +
            ' · pewnosc ' + (item.confidence || 0) + '%</div></div>';
        }

        const reasons = (item.reasons || []).slice(0, 3);
        const reasonsHtml = reasons.length
          ? '<ul class="reasons">' + reasons.map(r => '<li>' + r + '</li>').join('') + '</ul>'
          : '<div class="reasons">' + (item.summary || '') + '</div>';

        card.innerHTML = '<div class="top"><div><div class="sym">' + (item.symbol || '').toUpperCase() +
          '</div><div class="name">' + (item.symbol || '') + '</div></div><span class="badge ' + decClass(d) + '">' + d +
          '</span></div>' +
          freshnessHtml(item) +
          modulesHtml(item) +
          entryHtml +
          reasonsHtml;
        grid.appendChild(card);
      });
      if (latest) document.getElementById('updated').textContent = 'Dane z: ' + new Date(latest).toLocaleString('pl-PL') + ' · TF: 4H';
    }

    function openModal(idx) {
      const item = DATA[idx];
      const d = item.decision || 'BRAK';
      document.getElementById('m-title').textContent = (item.symbol || '').toUpperCase();

      let html = '<div class="decision-hero ' + decClass(d) + '"><div class="big">' + d + '</div>' +
        '<div style="margin-top:6px;color:var(--muted);font-size:0.9rem">' +
        (d === 'BRAK' ? 'Brak setupu 4H' : 'Setup 4H · confluence ' + (item.confluence || '—')) + '</div></div>' +
        '<div class="metrics">' +
        '<div class="metric"><div class="lbl">Wejscie</div><div class="val">' + fmt(item.entry) + '</div></div>' +
        '<div class="metric"><div class="lbl">Stop</div><div class="val">' + fmt(item.stop) + '</div></div>' +
        '<div class="metric"><div class="lbl">Cel</div><div class="val">' + fmt(item.target) + '</div></div></div>' +
        '<div class="metrics">' +
        '<div class="metric"><div class="lbl">R:R</div><div class="val">' + (item.rr != null ? '1:' + item.rr : '—') + '</div></div>' +
        '<div class="metric"><div class="lbl">ATR(14)</div><div class="val">' + fmt(item.atr_4h) + '</div></div>' +
        '<div class="metric"><div class="lbl">Ocena sygnału</div><div class="val">' + (item.confidence || 0) + '/100</div></div></div>' +
        '<div class="section"><div class="section-title">Wykres świecowy 4H · OHLC</div><div id="price-chart"></div><div class="chart-note">Dane Yahoo Finance · Entry / Stop Loss / Take Profit · wykryte formacje</div></div>';

      html += '<div class="section"><div class="section-title">Dlaczego</div>';
      if (item.reasons && item.reasons.length) {
        html += '<ul class="reasons">' + item.reasons.map(r => '<li>' + r + '</li>').join('') + '</ul>';
      } else {
        html += '<div class="empty">Brak</div>';
      }
      html += '</div>';

      html += '<div class="section"><div class="section-title">Filary confluence</div>' +
        '<span class="tag ' + (item.filars && item.filars.renko ? 'bull' : '') + '">Renko ' + (item.filars && item.filars.renko ? '✅' : '⚪') + '</span>' +
        '<span class="tag ' + (item.filars && item.filars.harmonic ? 'bull' : '') + '">Harmoniczna ' + (item.filars && item.filars.harmonic ? '✅' : '⚪') + '</span>' +
        '<span class="tag ' + (item.filars && item.filars.candle ? 'bull' : '') + '">Swieca ' + (item.filars && item.filars.candle ? '✅' : '⚪') + '</span>' +
        '</div>';

      html += '<div class="section"><div class="section-title">Kontekst Daily</div>' +
        '<span class="tag">' + (item.daily_context || '—') + '</span></div>';

      html += '<div class="section"><div class="section-title">Harmoniczne 4H</div>';
      const tf4 = (item.timeframes || {})['4H'] || {};
      if (tf4.harmonics && tf4.harmonics.length) {
        tf4.harmonics.forEach(h => {
          html += '<span class="tag ' + (h.direction === 'bullish' ? 'bull' : 'bear') + '">' + h.name + ' ' + h.direction + ' (' + h.status + ')</span>';
        });
      } else {
        html += '<span class="empty">brak</span>';
      }
      html += '</div>';

      html += '<div class="section"><div class="section-title">Swiece 4H</div>';
      const imp = ['Bullish Engulfing', 'Bearish Engulfing', 'Hammer', 'Shooting Star', 'Morning Star', 'Evening Star'];
      const cands = ((tf4.candles) || []).filter(c => imp.includes(c.name));
      if (cands.length) {
        cands.forEach(c => {
          html += '<span class="tag ' + (c.direction === 'bullish' ? 'bull' : c.direction === 'bearish' ? 'bear' : '') + '">' + c.name + '</span>';
        });
      } else {
        html += '<span class="empty">brak silnych</span>';
      }
      html += '</div>';

      html += '<div class="ctx"><div class="section-title">Kontekst</div>';
      ['1H', 'Daily'].forEach(tf => {
        const t = (item.timeframes || {})[tf];
        if (!t || t.error) return;
        const r = t.renko || {};
        html += '<div>' + tf + ': Renko ' + (r.direction === 'up' ? '↑' : r.direction === 'down' ? '↓' : '?') + ' ×' + (r.consecutive || 0) + '</div>';
      });
      const t4 = (item.candle_close_time || item.timestamp);
      if (t4) html += '<div style="margin-top:6px">Świeca 4H zamknięta: ' + new Date(t4).toLocaleString('pl-PL') + (item.candle_stale ? ' ⏳' : '') + '</div>';
      html += '</div>';

      document.getElementById('m-body').innerHTML = html;
      document.getElementById('modal').classList.add('open');
      requestAnimationFrame(() => renderPriceChart(item.symbol, item));
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    Promise.all([loadChartData(), load()]).catch(err => console.error(err));
  </script>
</body>
</html>
